# Fires Grok Bot "3Chat Daily E2E" via webhook at 05:17 Asia/Shanghai (off-minute to avoid GitHub Actions on-the-hour schedule delays).
# Secrets required (repo Actions secrets — do NOT invent values):
#   GROK_BOT_DAILY_WEBHOOK_URL
#   GROK_BOT_DAILY_WEBHOOK_AUTH  (Authorization header value from the Grok Bot routine panel)
name: 3Chat Daily E2E webhook

on:
  schedule:
    # 05:17 Asia/Shanghai = 21:17 UTC previous calendar day
    - cron: "17 21 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: POST Grok Bot webhook
        env:
          WEBHOOK_URL: ${{ secrets.GROK_BOT_DAILY_WEBHOOK_URL }}
          WEBHOOK_AUTH: ${{ secrets.GROK_BOT_DAILY_WEBHOOK_AUTH }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL}" ] || [ -z "${WEBHOOK_AUTH}" ]; then
            echo "Missing GROK_BOT_DAILY_WEBHOOK_URL or GROK_BOT_DAILY_WEBHOOK_AUTH secrets" >&2
            exit 1
          fi
          # Normalize WEBHOOK_AUTH to handle different secret formats:
          # - "Bearer <token>" → use as-is
          # - "Authorization: Bearer <token>" → strip prefix
          # - raw token → add "Bearer " prefix
          NORMALIZED="${WEBHOOK_AUTH}"
          # Trim leading/trailing whitespace
          NORMALIZED="$(echo "${NORMALIZED}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          # Strip "Authorization:" prefix if present (case-insensitive)
          NORMALIZED="$(echo "${NORMALIZED}" | sed -E 's/^[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Aa][Tt][Ii][Oo][Nn]:[[:space:]]*//')"
          # Add "Bearer " prefix if not present (case-insensitive)
          if ! echo "${NORMALIZED}" | grep -qiE '^[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]'; then
            NORMALIZED="Bearer ${NORMALIZED}"
          fi
          code=$(curl -sS -o /tmp/webhook-body.txt -w "%{http_code}" -X POST \
            -H "Authorization: ${NORMALIZED}" \
            -H "Content-Type: application/json" \
            -d '{"source":"github-actions","purpose":"3chat-daily-e2e"}' \
            "$WEBHOOK_URL")
          echo "HTTP $code"
          head -c 500 /tmp/webhook-body.txt || true
          echo
          case "$code" in
            2??) exit 0 ;;
            *) exit 1 ;;
          esac
